<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:,">
<title>Described buildings (dev)</title>
<style>
  html, body { margin: 0; height: 100%; background: #0d0e10; overflow: hidden; font: 12px/1.4 system-ui, sans-serif; color: #ddd; }
  #app { position: fixed; inset: 0; }
  #ui { position: fixed; left: 10px; top: 10px; display: flex; gap: 6px; flex-wrap: wrap; align-items: center;
        background: rgba(10, 11, 13, 0.7); padding: 6px 8px; border-radius: 6px; z-index: 2; }
  #ui select, #ui label { font: inherit; color: #ddd; background: #1d1f23; border: 1px solid #333; border-radius: 4px; padding: 2px 6px; }
  #stats { position: fixed; left: 10px; bottom: 10px; background: rgba(10, 11, 13, 0.7); padding: 4px 8px; border-radius: 6px; white-space: pre; z-index: 2; }
  body.shot #ui, body.shot #stats { display: none; }
</style>
</head>
<body>
<div id="app"></div>
<div id="ui">
  <select id="pose"></select>
  <select id="time"><option>noon</option><option>golden</option><option>dusk</option><option>night</option></select>
  <select id="city"><option value="described">city: landmarks + inferred</option><option value="generic">city: generic builder</option></select>
</div>
<div id="stats"></div>
<script type="module" src="./buildings.js"></script>
</body>
</html>
